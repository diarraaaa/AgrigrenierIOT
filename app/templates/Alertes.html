<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Alertes - Grenier Intelligent</title>
    <style>
        :root {
            --primary-color: rgb(42, 112, 19);
            --secondary-color: #fce57e;
            --background-color: linear-gradient(45deg, transparent 20%, rgba(255, 215, 0, 0.2) 50%, transparent 80%);
            --text-color: #333;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(45deg, transparent 20%, rgba(255, 215, 0, 0.2) 50%, transparent 80%);
            color: var(--text-color);
            min-height: 100vh;
        }
        
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            color: #ffd700;
            font-size: 2rem;
        }

        .logo span {
            color: #ffd700;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin-left: 1.5rem;
        }
        
        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }
        
        nav ul li a:hover {
            color: var(--secondary-color);
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .page-title {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 2rem;
        }
        
        .welcome-message {
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 2rem;
        }
        
        .alerts-section {
            background-color: white;
            border-radius: 10px;
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        
        .alerts-header {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alerts-header i {
            font-size: 1.8rem;
        }
        
        .alerts-list {
            list-style: none;
        }
        
        .alert-item {
            padding: 1rem;
            margin-bottom: 1rem;
            border-left: 4px solid var(--primary-color);
            background-color: #f9f9f9;
            border-radius: 5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .alert-item:hover {
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        
        .alert-item:last-child {
            margin-bottom: 0;
        }
        
        .alert-header {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .alert-date {
            font-size: 0.9rem;
            color: #666;
        }
        
        .alert-kit {
            color: var(--primary-color);
            font-weight: 600;
        }
        
        .alert-message {
            color: #555;
            line-height: 1.5;
            margin-top: 0.5rem;
        }
        
        .no-alerts {
            text-align: center;
            padding: 3rem 1rem;
            color: #666;
        }
        
        .no-alerts i {
            font-size: 4rem;
            color: #ccc;
            margin-bottom: 1rem;
        }
        
        .no-alerts p {
            font-size: 1.1rem;
        }
        
        .back-button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
            display: block;
            margin: 0 auto;
        }
        
        .back-button:hover {
            background-color: #1e5b0c;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                padding: 1rem;
            }
            
            nav ul {
                margin-top: 1rem;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            nav ul li {
                margin: 0.5rem;
            }
            
            .page-title {
                font-size: 1.5rem;
            }
            
            .alerts-section {
                padding: 1.5rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-warehouse"></i>
            Grenier Intelligent
        </div>
        <nav>
            <ul>
                <li><a href="/">Accueil</a></li>
                <li><a href="/tableaudebord">Tableau de Bord</a></li>
                <li><a href="/boutiquepage">Boutique</a></li>
                <li><a href="/mescommandes">Mes Commandes</a></li>
                <li><a href="/monprofil">Mon profil</a></li>
                <li><a href="/deconnexion">Déconnexion</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h1 class="page-title">Mes Alertes</h1>
        
        <p class="welcome-message">Bienvenue sur la page de vos alertes, <span id="user-name">Utilisateur</span></p>
        
        <div class="alerts-section">
            <h2 class="alerts-header">
                <i class="fas fa-bell"></i>
                Vos alertes
            </h2>
            
            <ul class="alerts-list" id="alerts-container">
                <!-- Les alertes seront affichées ici par JavaScript -->
            </ul>
        </div>
        
        <form action="/tableaudebord">
            <input type="submit" value="Retour au tableau de bord" class="back-button">
        </form>
    </div>

    <script>
        // Simulation de données pour la démo (à remplacer par vos vraies données backend)
        const sessionData = {
            prenom: "Amadou"
        };

        // Exemple d'alertes (à remplacer par vos vraies données)
        const alertes = [
            {
                date_alerte: "29/10/2024 14:30",
                nom_kit: "Kit Capteur Température A1",
                enonce: "La température dans le grenier a dépassé le seuil de 35°C. Veuillez vérifier la ventilation."
            },
            {
                date_alerte: "28/10/2024 09:15",
                nom_kit: "Kit Humidité B2",
                enonce: "Niveau d'humidité élevé détecté (85%). Risque de moisissure."
            },
            {
                date_alerte: "27/10/2024 18:45",
                nom_kit: "Kit Sécurité C3",
                enonce: "Mouvement détecté dans le grenier à 18h45."
            }
        ];

        // Afficher le prénom de l'utilisateur
        document.getElementById('user-name').textContent = sessionData.prenom;

        // Afficher les alertes
        const alertsContainer = document.getElementById('alerts-container');
        
        if (alertes.length > 0) {
            alertes.forEach(alerte => {
                const alertItem = document.createElement('li');
                alertItem.className = 'alert-item';
                alertItem.innerHTML = `
                    <div class="alert-header">
                        <i class="fas fa-exclamation-circle"></i>
                        <span class="alert-date">${alerte.date_alerte}</span>
                        <span>-</span>
                        <span class="alert-kit">${alerte.nom_kit}</span>
                    </div>
                    <div class="alert-message">
                        ${alerte.enonce}
                    </div>
                `;
                alertsContainer.appendChild(alertItem);
            });
        } else {
            alertsContainer.innerHTML = `
                <div class="no-alerts">
                    <i class="fas fa-check-circle"></i>
                    <p>Aucune alerte disponible.</p>
                    <p style="color: #999; font-size: 0.9rem; margin-top: 0.5rem;">Votre grenier fonctionne normalement.</p>
                </div>
            `;
        }

        // Pour tester sans alertes, décommentez la ligne ci-dessous:
        // alertes.length = 0; // puis rechargez la page
    </script>
</body>
</html>
