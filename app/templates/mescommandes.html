<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - Grenier Intelligent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #ffffff 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(74, 222, 128, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(34, 197, 94, 0.08) 0%, transparent 50%);
            pointer-events: none;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            padding: 1.2rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 3rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            transition: transform 0.3s ease;
            text-decoration: none;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .logo i {
            color: #4ade80;
            font-size: 2rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logo span {
            color: #4ade80;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 0.5rem;
        }

        nav ul li a {
            color: #64748b;
            text-decoration: none;
            padding: 0.7rem 1.3rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: 500;
            position: relative;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav ul li a::before {
            content: '';
            position: absolute;
            bottom: 5px;
            left: 50%;
            width: 0;
            height: 2px;
            background: #4ade80;
            transform: translateX(-50%);
            transition: width 0.3s ease;
        }

        nav ul li a:hover {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        nav ul li a:hover::before {
            width: 60%;
        }

        /* Container */
        main {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 3rem;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Page Header */
        .page-header {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            text-align: center;
            border: 1px solid rgba(74, 222, 128, 0.1);
        }

        .page-title {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: #64748b;
            font-size: 1.1rem;
        }

        /* Summary Card */
        .summary-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.1);
        }

        .summary-title {
            font-size: 1.5rem;
            color: #1a1a1a;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .summary-title i {
            color: #4ade80;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(34, 197, 94, 0.08));
            padding: 1.5rem;
            border-radius: 18px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(74, 222, 128, 0.1);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: #4ade80;
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(34, 197, 94, 0.15));
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #64748b;
            font-size: 1rem;
            font-weight: 500;
        }

        /* Orders List */
        .orders-list {
            display: grid;
            gap: 2rem;
        }

        .order-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(74, 222, 128, 0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .order-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #4ade80, #22c55e);
        }

        .order-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 60px rgba(74, 222, 128, 0.15);
            border-color: #4ade80;
        }

        .order-header {
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            align-items: center;
        }

        .order-id {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .order-id i {
            color: #4ade80;
        }

        .order-date {
            color: #64748b;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .order-date i {
            color: #4ade80;
        }

        .order-status {
            padding: 0.6rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            justify-self: center;
        }

        .status-pending {
            background: rgba(255, 152, 0, 0.15);
            color: #ff9800;
        }

        .status-delivered {
            background: rgba(74, 222, 128, 0.15);
            color: #22c55e;
        }

        .status-processing {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
        }

        .order-amount {
            font-weight: 700;
            font-size: 1.4rem;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            justify-self: end;
        }

        .order-toggle {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.08), rgba(34, 197, 94, 0.08));
            color: #1a1a1a;
            border: none;
            width: 100%;
            padding: 1.2rem;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .order-toggle:hover {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.15), rgba(34, 197, 94, 0.15));
        }

        .toggle-icon {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-right: 3px solid #4ade80;
            border-bottom: 3px solid #4ade80;
            transform: rotate(45deg);
            transition: transform 0.3s ease;
        }

        .order-toggle.active .toggle-icon {
            transform: rotate(-135deg);
        }

        .order-items {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease;
        }

        .product-list {
            list-style: none;
            padding: 1.5rem 2rem;
        }

        .product-item {
            padding: 1.2rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.05), rgba(34, 197, 94, 0.05));
            border-radius: 12px;
            border: 1px solid rgba(74, 222, 128, 0.1);
            transition: all 0.3s ease;
        }

        .product-item:hover {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.1), rgba(34, 197, 94, 0.1));
            border-color: #4ade80;
            transform: translateX(5px);
        }

        .product-item:last-child {
            margin-bottom: 0;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1a1a1a;
            font-size: 1.1rem;
        }

        .product-details {
            display: flex;
            gap: 1.5rem;
            color: #64748b;
            font-size: 0.95rem;
            flex-wrap: wrap;
        }

        .product-details span {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .product-details i {
            color: #4ade80;
        }

        .product-price {
            font-weight: 700;
            font-size: 1.2rem;
            color: #4ade80;
        }

        .order-total {
            padding: 2rem;
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.1), rgba(34, 197, 94, 0.1));
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 1.3rem;
            border-top: 2px solid rgba(74, 222, 128, 0.2);
        }

        .order-total span:first-child {
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .order-total span:first-child i {
            color: #4ade80;
        }

        .order-total span:last-child {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* No Orders */
        .no-orders {
            text-align: center;
            padding: 4rem 2rem;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(74, 222, 128, 0.1);
        }

        .no-orders i {
            font-size: 5rem;
            color: #4ade80;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .no-orders h2 {
            font-size: 2rem;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .no-orders p {
            color: #64748b;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .no-orders a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
        }

        .no-orders a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 222, 128, 0.4);
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            color: #4ade80;
        }

        .loading i {
            font-size: 3rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container {
                padding: 0 1rem;
                flex-direction: column;
                gap: 1rem;
            }

            nav ul {
                flex-wrap: wrap;
                justify-content: center;
            }

            main {
                padding: 0 1rem;
            }

            .summary-stats {
                grid-template-columns: 1fr;
            }

            .order-header {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .order-amount {
                justify-self: center;
            }

            .order-status {
                justify-self: center;
            }

            .product-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }

            .product-details {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-warehouse"></i>
                <span>GrenierSmart</span>
            </a>
            <nav>
                <ul>
                    <li><a href="/"><i class="fas fa-home"></i> Accueil</a></li>
                    <li><a href="/tableaudebord"><i class="fas fa-chart-line"></i> Dashboard</a></li>
                    <li><a href="/boutiquepage"><i class="fas fa-shopping-cart"></i> Boutique</a></li>
                    <li><a href="/mescommandes"><i class="fas fa-box"></i> Commandes</a></li>
                    <li><a href="/monprofil"><i class="fas fa-user"></i> Profil</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <main>
        <div class="page-header">
            <h1 class="page-title">📦 Mes Commandes</h1>
            <p class="page-subtitle">Suivez l'état de toutes vos commandes en temps réel</p>
        </div>
        
        <section class="summary-card">
            <h2 class="summary-title">
                <i class="fas fa-chart-bar"></i>
                Résumé de mes commandes
            </h2>
            <div class="summary-stats">
                <div class="stat-card">
                    <div class="stat-value" id="total-orders">0</div>
                    <div class="stat-label">Commandes totales</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="pending-orders">0</div>
                    <div class="stat-label">En traitement</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="delivered-orders">0</div>
                    <div class="stat-label">Livrées</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="total-spent">0</div>
                    <div class="stat-label">Montant total (FCFA)</div>
                </div>
            </div>
        </section>
        
        <section class="orders-list" id="orders-container">
            <div class="loading">
                <i class="fas fa-spinner"></i>
                <p>Chargement de vos commandes...</p>
            </div>
        </section>
    </main>
    
    <script>
        const userid = "{{session['id']}}";
        
        // Fonction pour charger les commandes depuis le backend
        async function loadOrders() {
            try {
                const response = await fetch('/api/commandes', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des commandes');
                }
                
                const data = await response.json();
                displayOrders(data.commandes || []);
            } catch (error) {
                console.error('Erreur:', error);
                // Fallback vers localStorage si l'API échoue
                loadOrdersFromLocalStorage();
            }
        }
        
        // Fonction de fallback pour charger depuis localStorage
        function loadOrdersFromLocalStorage() {
            const orders = JSON.parse(localStorage.getItem('orders') || '[]');
            displayOrders(orders);
        }
        
        // Fonction pour afficher les commandes
        function displayOrders(orders) {
            const container = document.getElementById('orders-container');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = `
                    <div class="no-orders">
                        <i class="fas fa-shopping-basket"></i>
                        <h2>Aucune commande trouvée</h2>
                        <p>Vous n'avez pas encore passé de commande. Découvrez nos produits dès maintenant !</p>
                        <a href="/boutiquepage">
                            <i class="fas fa-shopping-cart"></i>
                            Découvrir la boutique
                        </a>
                    </div>
                `;
                updateSummary([], 0, 0, 0);
                return;
            }
            
            // Calculer les statistiques
            let totalOrders = orders.length;
            let pendingOrders = 0;
            let deliveredOrders = 0;
            let totalSpent = 0;
            
            orders.forEach(order => {
                totalSpent += order.total || 0;
                if (order.status === 'En traitement' || order.status === 'En attente') {
                    pendingOrders++;
                } else if (order.status === 'Livrée' || order.status === 'Livré') {
                    deliveredOrders++;
                }
            });
            
            updateSummary(totalOrders, pendingOrders, deliveredOrders, totalSpent);
            
            // Afficher les commandes
            container.innerHTML = orders.map((order, index) => {
                const orderDate = new Date(order.date);
                const formattedDate = orderDate.toLocaleDateString('fr-FR', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric'
                });
                
                let statusClass = 'status-pending';
                let statusIcon = 'fa-clock';
                
                if (order.status === 'Livrée' || order.status === 'Livré') {
                    statusClass = 'status-delivered';
                    statusIcon = 'fa-check-circle';
                } else if (order.status === 'En cours') {
                    statusClass = 'status-processing';
                    statusIcon = 'fa-truck';
                }
                
                const itemsHtml = order.items.map(item => `
                    <li class="product-item">
                        <div class="product-info">
                            <div class="product-name">${item.name}</div>
                            <div class="product-details">
                                <span><i class="fas fa-box"></i> Quantité: ${item.quantity}</span>
                                <span><i class="fas fa-tag"></i> Prix unitaire: ${item.price.toLocaleString()} FCFA</span>
                            </div>
                        </div>
                        <div class="product-price">${(item.price * item.quantity).toLocaleString()} FCFA</div>
                    </li>
                `).join('');
                
                return `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="order-id">
                                <i class="fas fa-shopping-bag"></i>
                                Commande #${order.id || (1000 + index)}
                            </div>
                            <div class="order-date">
                                <i class="fas fa-calendar"></i>
                                ${formattedDate}
                            </div>
                            <div class="order-status ${statusClass}">
                                <i class="fas ${statusIcon}"></i>
                                ${order.status}
                            </div>
                            <div class="order-amount">${order.total.toLocaleString()} FCFA</div>
                        </div>
                        <div class="order-content">
                            <button class="order-toggle" onclick="toggleOrder(this)">
                                Détails de la commande <span class="toggle-icon"></span>
                            </button>
                            <div class="order-items">
                                <ul class="product-list">
                                    ${itemsHtml}
                                </ul>
                                <div class="order-total">
                                    <span><i class="fas fa-receipt"></i> Total</span>
                                    <span>${order.total.toLocaleString()} FCFA</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        // Fonction pour mettre à jour les statistiques
        function updateSummary(total, pending, delivered, spent) {
            document.getElementById('total-orders').textContent = total;
            document.getElementById('pending-orders').textContent = pending;
            document.getElementById('delivered-orders').textContent = delivered;
            document.getElementById('total-spent').textContent = spent.toLocaleString();
        }
        
        // Fonction pour basculer l'affichage des détails
        function toggleOrder(button) {
            button.classList.toggle('active');
            const orderItems = button.nextElementSibling;
            
            if (button.classList.contains('active')) {
                orderItems.style.maxHeight = orderItems.scrollHeight + 'px';
            } else {
                orderItems.style.maxHeight = '0px';
            }
        }
        
        // Charger les commandes au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            loadOrders();
        });
    </script>
</body>
</html>
